name: CI Pipeline

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: pnpm install

      - name: Build Frontend
        working-directory: ./frontend
        run: pnpm build

      - name: Lint Frontend
        working-directory: ./frontend
        run: pnpm lint

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: pnpm install

      - name: Set up MongoDB
        uses: supercharge/mongodb-github-action@1.10.0
        with:
          mongodb-version: '6.0'

      - name: Run Backend Tests
        working-directory: ./backend
        run: pnpm test
        env:
          MONGO_URI: mongodb://localhost:27017/friendfinder
          PORT: 5000
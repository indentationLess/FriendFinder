version: '3.8'

services:
  mongo:
    image: mongo:5.0
    container_name: friendfinder_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: friendfinder_backend
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongo:27017/friendfinder
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: friendfinder_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile.nginx
    container_name: nginx
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend

volumes:
  mongo-data:


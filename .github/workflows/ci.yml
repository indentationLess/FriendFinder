name: CI Pipeline

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Backend Dependencies
        run: |
          cd backend
          pnpm install

      - name: Lint Backend Code
        run: |
          cd backend
          pnpm run lint

      - name: Test Backend
        run: |
          cd backend
          pnpm test

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          pnpm install

      - name: Lint Frontend Code
        run: |
          cd frontend
          pnpm run lint

      - name: Test Frontend
        run: |
          cd frontend
          pnpm test

      - name: Build Frontend
        run: |
          cd frontend
          pnpm run build
